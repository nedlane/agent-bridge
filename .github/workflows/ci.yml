name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck

      - name: Validate Bash syntax
        run: |
          for f in bin/*; do
            [[ -f "$f" ]] || continue
            head -1 "$f" | grep -qE 'python' && continue
            bash -n "$f"
          done

      - name: ShellCheck (shell tools only)
        run: |
          for f in bin/*; do
            [[ -f "$f" ]] || continue
            head -1 "$f" | grep -qE 'zsh|python' && continue
            shellcheck "$f"
          done

      - name: Validate Python tool syntax
        run: |
          for f in bin/*; do
            [[ -f "$f" ]] || continue
            head -1 "$f" | grep -qE 'python' || continue
            PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile "$f"
          done

      - name: Validate profile JSON
        run: |
          for f in claude-profiles/*.json; do
            jq empty "$f"
          done
          jq empty config.example.json
          jq empty pricing.json

      - name: Validate refresh-pricing.py syntax
        # Deliberately NOT `--check`: that hits the network, so a change to
        # upstream pricing would redden CI on an unrelated PR. Staleness is a
        # thing to notice and commit, not a build failure.
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/refresh-pricing.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Ruff (Python error lint)
        run: |
          pip install ruff
          # Pass extensionless Python tools explicitly: ruff lints files given
          # by path regardless of extension.
          # E9/F63/F7/F82 catch real errors (syntax, undefined names,
          # f-string/assert bugs) only — no style noise, so CI never reddens
          # over formatting.
          python_tools=()
          for f in bin/*; do
            [[ -f "$f" ]] || continue
            head -1 "$f" | grep -qE 'python' && python_tools+=("$f")
          done
          ruff check --select E9,F63,F7,F82 "${python_tools[@]}" tests
